# Fly.io (ADR 0020). Secrets (DATABASE_URL, BETTER_AUTH_SECRET…) go with `fly secrets set`, never here: see docs/despliegue.md
app = "nitsu-collectibles"
primary_region = "gru"   # São Paulo, the closest to Chile

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "3000"
  ART_DIR = "/data/art"   # uploaded pictures, on the volume below

[[mounts]]
  source = "nitsu_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # the price and catalog jobs run inside the app: keep one machine always on
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
